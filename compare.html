<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>渋滞ダッシュボード — Before / After 比較</title>
<style>
  :root{
    --bg:#e9e9e4; --surface:#fff; --ink:#22221e; --muted:#6c6b64;
    --line:#dcdbd3; --info:#1668b8; --good:#1d9e75; --prejam:#d85a30;
    --sh:0 2px 10px rgba(28,26,20,.08);
    --ease:cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic UI","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
    display:flex;flex-direction:column;height:100vh;overflow:hidden}

  .bar{display:flex;align-items:center;gap:14px;padding:10px 18px;background:rgba(255,255,255,.9);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);flex-wrap:wrap;flex:none}
  .bar .t{font-size:15px;font-weight:800;letter-spacing:.01em}
  .bar .sub{font-size:12px;color:var(--muted)}
  .spacer{flex:1}
  .modes{display:flex;gap:6px}
  .modes button{font:inherit;font-size:12px;font-weight:700;padding:6px 12px;border:1px solid var(--line);
    border-radius:999px;background:var(--surface);color:var(--muted);cursor:pointer;
    transition:all .16s var(--ease)}
  .modes button:hover{border-color:#c9c8bf}
  .modes button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .hint{font-size:11.5px;color:var(--muted)}

  .stage{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:0;min-height:0}
  .stage.stacked{grid-template-columns:1fr;grid-template-rows:1fr 1fr}

  .pane{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;
    background:var(--surface);border-right:1px solid var(--line)}
  .stage.stacked .pane{border-right:none;border-bottom:1px solid var(--line)}
  .pane:last-child{border-right:none;border-bottom:none}

  .tag{position:absolute;left:12px;top:12px;z-index:5;display:flex;align-items:center;gap:7px;
    font-size:11px;font-weight:800;letter-spacing:.06em;padding:4px 11px;border-radius:999px;
    box-shadow:var(--sh);pointer-events:none}
  .tag.before{background:#f0efe9;color:var(--muted);border:1px solid var(--line)}
  .tag.after{background:#e7f6ee;color:var(--good);border:1px solid #bfe6d3}
  .tag .d{width:8px;height:8px;border-radius:50%}
  .tag.before .d{background:#b9b8ae}
  .tag.after .d{background:var(--good)}

  iframe{flex:1;width:100%;height:100%;border:0;background:#f2f2ee}

  /* single view modes */
  .stage.only-before .pane.after{display:none}
  .stage.only-after .pane.before{display:none}
  .stage.only-before,.stage.only-after{grid-template-columns:1fr;grid-template-rows:1fr}

  @media (max-width:900px){
    .stage{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
    .bar .sub{display:none}
  }
</style>
</head>
<body>
  <div class="bar">
    <span class="t">渋滞ダッシュボード</span>
    <span class="sub">Before / After 比較ビュー</span>
    <span class="spacer"></span>
    <span class="hint">表示:</span>
    <div class="modes" id="modes">
      <button data-mode="side" class="on">左右で比較</button>
      <button data-mode="before">Before のみ</button>
      <button data-mode="after">After のみ</button>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="pane before">
      <span class="tag before"><span class="d"></span>BEFORE · 旧版</span>
      <iframe src="index_before.html" title="Before（旧版・バックアップ）" loading="lazy"></iframe>
    </div>
    <div class="pane after">
      <span class="tag after"><span class="d"></span>AFTER · 改善版</span>
      <iframe src="index_after.html" title="After（改善版）" loading="lazy"></iframe>
    </div>
  </div>

  <script>
    var stage = document.getElementById('stage');
    document.getElementById('modes').addEventListener('click', function(e){
      var b = e.target.closest('button'); if(!b) return;
      document.querySelectorAll('#modes button').forEach(function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      stage.classList.remove('only-before','only-after','stacked');
      if(b.dataset.mode === 'before') stage.classList.add('only-before');
      else if(b.dataset.mode === 'after') stage.classList.add('only-after');
    });
  </script>
</body>
</html>
